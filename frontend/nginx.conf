server {
    listen      80;
    root        /usr/share/nginx/html;
    index       index.html;

    # Allow larger request bodies for photo uploads
    client_max_body_size 20M;

    # ── API reverse-proxy ─────────────────────────────────────────────────────
    # The frontend is built with VITE_API_BASE_URL="" so every fetch in api.ts
    # produces a relative path (e.g. /auth/login).  This block forwards all
    # recognised backend prefixes to the backend container.
    location ~ ^/(auth|admin|courses|sessions|attendance|ready)(/.*)?$ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Face-recognition inference can take several seconds
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── ORT Web worker scripts ────────────────────────────────────────────────
    # Browsers enforce strict MIME checking for ES module scripts.
    # nginx:alpine's mime.types does not include .mjs so it falls back to
    # application/octet-stream, which browsers reject.  Override it here.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
    }

    # ── SPA catch-all ─────────────────────────────────────────────────────────
    # Static assets are served directly; everything else falls back to
    # index.html so React Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
