services:

  # ── Backend (FastAPI + InsightFace) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
    environment:
      # Override JWT_SECRET via a root-level .env file or shell export.
      # Never commit a real secret — this default is for local dev only.
      JWT_SECRET: ${JWT_SECRET:-changeme-replace-with-a-strong-secret}
      # SQLite stored in a named volume so data survives container restarts.
      DATABASE_URL: sqlite:////app/db/face_recognition_attendance.db
      # Uploaded face photos stored in a separate named volume.
      UPLOAD_DIR: /app/uploads
      # Allow requests from the frontend nginx container.
      CORS_ALLOWED_ORIGINS: http://localhost
      PORT: "8000"
    volumes:
      - db_data:/app/db
      - uploads:/app/uploads
    restart: unless-stopped
    # Uncomment to expose the API directly on the host (useful for debugging):
    # ports:
    #   - "8000:8000"

  # ── Frontend (React + Vite, served by nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Empty string → relative URLs → nginx proxies them to the backend.
        # Set to a full URL here or via --build-arg for other deploy targets.
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  db_data:   # SQLite database file
  uploads:   # Uploaded face photos / embeddings
