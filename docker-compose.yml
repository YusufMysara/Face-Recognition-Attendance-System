services:

  # ── Backend (FastAPI + InsightFace) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
    environment:
      # Change this before deploying to production.
      JWT_SECRET: dev-secret-change-in-production-32chars
      # SQLite stored in a named volume so data survives container restarts.
      DATABASE_URL: sqlite:////app/db/face_recognition_attendance.db
      # Uploaded face photos stored in a separate named volume.
      UPLOAD_DIR: /app/uploads
      # Allow requests only from the nginx frontend container.
      CORS_ALLOWED_ORIGINS: http://localhost
      PORT: "8000"
    volumes:
      - db_data:/app/db
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      # /ready returns 200 as soon as uvicorn is up (InsightFace warms up in
      # the background — the frontend's login/dashboard work immediately).
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Uncomment to expose the API directly on the host for debugging:
    # ports:
    #   - "8000:8000"

  # ── Frontend (React + Vite, served by nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Empty string → relative URLs → nginx proxies them to the backend.
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  db_data:   # SQLite database file
  uploads:   # Uploaded face photos / embeddings
